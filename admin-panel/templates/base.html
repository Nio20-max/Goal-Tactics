<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GoalTactics Admin{% endblock %}</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-hover: #22263a;
            --border: #2a2e3d;
            --text: #e4e4e7;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --orange: #f97316;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Navigation */
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav .brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent);
            text-decoration: none;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        nav a:hover, nav a.active {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.2rem 0.7rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-active { background: rgba(34,197,94,0.15); color: var(--green); }
        .status-inactive { background: rgba(239,68,68,0.15); color: var(--red); }
        .status-warning { background: rgba(234,179,8,0.15); color: var(--yellow); }

        /* Layout */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        /* Cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.2rem;
        }

        .card-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
        }

        .card-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .card-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        /* Tables */
        .table-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.2rem;
            border-bottom: 1px solid var(--border);
        }

        .table-header h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--bg);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.7rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th a {
            color: var(--text-muted);
            text-decoration: none;
        }

        th a:hover, th a.sorted {
            color: var(--accent);
        }

        td {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }

        tr:hover {
            background: var(--surface-hover);
        }

        /* Log viewer */
        .log-container {
            background: #0a0b0f;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            overflow: auto;
            max-height: 70vh;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-line { color: var(--text-muted); }
        .log-line.error { color: var(--red); }
        .log-line.warning { color: var(--yellow); }
        .log-line.info { color: var(--green); }
        .log-line.highlight { background: rgba(59,130,246,0.2); color: var(--text); }

        /* Forms */
        .toolbar {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        input[type="text"], input[type="number"], select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        button, .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.2s;
        }

        button:hover, .btn:hover {
            background: var(--accent-hover);
        }

        .btn-sm {
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
        }

        /* Pagination */
        .pagination {
            display: flex;
            gap: 0.4rem;
            justify-content: center;
            padding: 1rem;
        }

        .pagination a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            font-size: 0.8rem;
        }

        .pagination a:hover { background: var(--surface-hover); }
        .pagination a.current { background: var(--accent); color: white; border-color: var(--accent); }

        /* Sidebar layout for logs */
        .two-col {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 1rem;
        }

        .sidebar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
        }

        .sidebar a {
            display: block;
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
        }

        .sidebar a:hover { background: var(--surface-hover); color: var(--text); }
        .sidebar a.active { background: var(--accent); color: white; }

        .sidebar h3 {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        /* Bot detail grid */
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .detail-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.8rem;
        }

        .detail-item .label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detail-item .value {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 0.2rem;
        }

        /* Activity bar */
        .activity-bar {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            width: 100%;
        }

        .activity-bar .fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }

        .fill-green { background: var(--green); }
        .fill-yellow { background: var(--yellow); }
        .fill-red { background: var(--red); }
        .fill-blue { background: var(--accent); }

        /* Responsive */
        @media (max-width: 768px) {
            nav { padding: 0 1rem; gap: 1rem; overflow-x: auto; }
            .container { padding: 1rem; }
            .two-col { grid-template-columns: 1fr; }
            .card-grid { grid-template-columns: 1fr 1fr; }
        }

        /* Auto-refresh indicator */
        .refresh-indicator {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="brand">⚽ GoalTactics</a>
        <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Dashboard</a>
        <a href="/logs" {% if '/logs' in request.path %}class="active"{% endif %}>Logs</a>
        <a href="/bots" {% if '/bots' in request.path %}class="active"{% endif %}>Bots</a>
        <a href="/analytics" {% if request.path == '/analytics' %}class="active"{% endif %}>Analytics</a>
        <a href="/backups" {% if request.path == '/backups' %}class="active"{% endif %}>Backups</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
